version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major upgrades (Next, React, Tailwind, ESLint) need a manual migration, so
    # Dependabot only proposes minor and patch updates. Security updates are
    # not affected by this rule.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    groups:
      actions:
        patterns: ["*"]
